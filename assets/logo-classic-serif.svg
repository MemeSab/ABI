<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 120" width="100%" height="100%" aria-label="Abigail Stocks Coaching Classic Serif Logo">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
            .serif-title {
                font-family: 'Cormorant Garamond', Georgia, serif;
                font-size: 32px;
                fill: #2C2D2B;
                font-weight: 600;
                letter-spacing: 0.22em;
                text-transform: uppercase;
            }
            .serif-sub {
                font-family: 'Plus Jakarta Sans', sans-serif;
                font-size: 9.5px;
                font-weight: 600;
                letter-spacing: 0.42em;
                fill: #737570;
                text-transform: uppercase;
            }
        </style>
    </defs>
    <g transform="translate(10, 25)">
        <!-- Classic Serif "ABIGAIL STOCKS" -->
        <text x="10" y="40" class="serif-title">ABIGAIL STOCKS</text>

        <!-- Subtext "COACHING" -->
        <text x="12" y="65" class="serif-sub">C O A C H I N G</text>
    </g>
</svg>
