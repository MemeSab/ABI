<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="100%" height="100%" aria-label="Abigail Stocks Coaching Stacked Logo">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
            .brand-script-stacked {
                font-family: 'Alex Brush', 'Cormorant Garamond', cursive;
                font-size: 88px;
                fill: #2C2D2B;
                font-weight: 400;
                text-anchor: middle;
            }
            .brand-title-stacked {
                font-family: 'Plus Jakarta Sans', sans-serif;
                font-size: 22px;
                font-weight: 600;
                letter-spacing: 0.45em;
                fill: #2C2D2B;
                text-transform: uppercase;
                text-anchor: middle;
            }
            .brand-sub-stacked {
                font-family: 'Plus Jakarta Sans', sans-serif;
                font-size: 13px;
                font-weight: 500;
                letter-spacing: 0.35em;
                fill: #737570;
                text-transform: uppercase;
                text-anchor: middle;
            }
        </style>
    </defs>
    <g transform="translate(225, 140)">
        <!-- Signature "Abigail" Centered -->
        <text x="0" y="30" class="brand-script-stacked">Abigail</text>

        <!-- Elegant Minimal Line Divider -->
        <line x1="-50" y1="75" x2="50" y2="75" stroke="#EBE5DA" stroke-width="1.2" />

        <!-- Block "STOCKS" -->
        <text x="5" y="125" class="brand-title-stacked">STOCKS</text>
        
        <!-- Block "COACHING" -->
        <text x="3" y="156" class="brand-sub-stacked">COACHING</text>
    </g>
</svg>
