<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="100%" aria-label="Abigail Stocks Coaching Jody Moore Style Logo with Botanical Leaf">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap');
            svg { overflow: visible; }
            .jm-script {
                font-family: 'Caveat', cursive;
                font-size: 92px;
                fill: #1F201E;
                font-weight: 500;
            }
            .jm-sub {
                font-family: 'Plus Jakarta Sans', sans-serif;
                font-size: 16px;
                font-weight: 700;
                letter-spacing: 0.42em;
                fill: #3F4B3C;
                text-transform: uppercase;
            }
            .leaf-icon {
                stroke: #5F7359;
                stroke-width: 1.8;
                fill: none;
            }
        </style>
    </defs>
    <g transform="translate(15, 20)">
        <!-- Green Botanical Leaf Shape Icon -->
        <g transform="translate(0, 18) scale(2.4)">
            <path class="leaf-icon" d="M12 2C12 2 7 7 7 12C7 17 12 22 12 22C12 22 17 17 17 12C17 7 12 2 12 2Z"/>
            <path class="leaf-icon" d="M12 2V22"/>
        </g>

        <!-- Lowercase Refined Monoline Script "abigail stocks" -->
        <text x="75" y="70" class="jm-script">abigail stocks</text>

        <!-- Elegant "COACHING" subtext aligned right below "stocks" -->
        <text x="315" y="112" class="jm-sub">COACHING</text>
    </g>
</svg>
