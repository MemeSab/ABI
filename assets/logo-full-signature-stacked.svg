<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" aria-label="Abigail Stocks Coaching Stacked Full Signature Logo">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
            svg { overflow: visible; }
            .full-script-stacked {
                font-family: 'Alex Brush', 'Cormorant Garamond', cursive;
                font-size: 82px;
                fill: #2C2D2B;
                font-weight: 400;
                text-anchor: middle;
            }
            .full-sub-stacked {
                font-family: 'Plus Jakarta Sans', sans-serif;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.45em;
                fill: #737570;
                text-transform: uppercase;
                text-anchor: middle;
            }
        </style>
    </defs>
    <g transform="translate(250, 180)">
        <!-- Full Signature "Abigail Stocks" Centered -->
        <text x="0" y="30" class="full-script-stacked">Abigail Stocks</text>

        <!-- Subtle Accent Line -->
        <line x1="-70" y1="85" x2="70" y2="85" stroke="#EBE5DA" stroke-width="1.2" />

        <!-- Subtext "COACHING" positioned nicely below the descender loop -->
        <text x="3" y="122" class="full-sub-stacked">COACHING</text>
    </g>
</svg>
