<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" aria-label="Abigail Stocks Coaching Stacked Logo">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@600&amp;display=swap');
            svg { overflow: visible; }
            .jm-stacked-script {
                font-family: 'Caveat', cursive;
                font-size: 84px;
                fill: #2C2D2B;
                font-weight: 400;
                text-anchor: middle;
            }
            .jm-stacked-sub {
                font-family: 'Plus Jakarta Sans', sans-serif;
                font-size: 14px;
                font-weight: 600;
                letter-spacing: 0.48em;
                fill: #5F615C;
                text-transform: uppercase;
                text-anchor: middle;
            }
        </style>
    </defs>
    <g transform="translate(300, 180)">
        <!-- Lowercase Refined Monoline Script "abigail stocks" -->
        <text x="0" y="45" class="jm-stacked-script">abigail stocks</text>

        <!-- Elegant "COACHING" Centered Below -->
        <text x="4" y="115" class="jm-stacked-sub">COACHING</text>
    </g>
</svg>
