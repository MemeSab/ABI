<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 150" width="100%" height="100%" aria-label="Abigail Stocks Coaching Full Signature Logo">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
            svg { overflow: visible; }
            .full-signature-script {
                font-family: 'Alex Brush', 'Cormorant Garamond', cursive;
                font-size: 58px;
                fill: #2C2D2B;
                font-weight: 400;
            }
            .full-signature-sub {
                font-family: 'Plus Jakarta Sans', sans-serif;
                font-size: 10.5px;
                font-weight: 600;
                letter-spacing: 0.52em;
                fill: #737570;
                text-transform: uppercase;
            }
        </style>
    </defs>
    <g transform="translate(15, 15)">
        <!-- Full Signature "Abigail Stocks" in script -->
        <text x="10" y="52" class="full-signature-script">Abigail Stocks</text>

        <!-- Subtext "COACHING" positioned at y=96 to completely clear the descender loop of 'g' -->
        <text x="16" y="96" class="full-signature-sub">C O A C H I N G</text>
    </g>
</svg>
